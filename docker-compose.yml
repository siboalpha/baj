services:
  frontend:
    build:
      context: ./baj-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: ./baj-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3000"
